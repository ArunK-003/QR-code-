<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a2d">
<title>AiVision360 | Links</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    font-family:Inter,Arial,Helvetica,sans-serif;color:#f5f8fc;
    background:radial-gradient(ellipse at 80% 10%,rgba(0,190,230,.15),transparent 34%),
               linear-gradient(145deg,#061426,#0a2540 58%,#071727)}
  .wrap{width:min(100%,440px);text-align:center}
  .brand{font-size:19px;font-weight:800;letter-spacing:.11em;margin:0 0 48px}
  .brand span{color:#13c6e8}
  .links{display:grid;gap:13px}
  a{display:flex;align-items:center;gap:15px;text-align:left;text-decoration:none;color:#f7fbff;
    padding:18px 19px;border:1px solid rgba(160,200,225,.22);border-radius:15px;
    background:rgba(255,255,255,.055);transition:.2s ease}
  a:hover{transform:translateY(-2px);border-color:#16c7e8;background:rgba(15,190,220,.10)}
  .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:rgba(18,197,228,.13);color:#32d4ef;flex:none}
  .ico svg{width:21px;height:21px}
  .label{font-size:16px;font-weight:750;display:block}
  .arrow{margin-left:auto;color:#6bdcf0;font-size:22px}
  footer{font-size:11px;color:#71879b;margin-top:42px;letter-spacing:.04em}
</style>
</head>
<body>
<main class="wrap">
  <section class="links">
    <a href="https://aivision360.com" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
      <span class="label">Visit our website</span>
      <span class="arrow">↗</span>
    </a>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScioAhwuz_WFuP66zvT4sgEFJpokn-evUav80fNuSSoYLQ8AQ/viewform?usp=publish-editor" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M15 3v5h5M9 13h6M9 17h6"/></svg></span>
      <span class="label">Get in touch</span>
      <span class="arrow">↗</span>
    </a>
  </section>
</main>
</body>
</html>
